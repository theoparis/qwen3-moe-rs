[package]
name = "qwen3-burn"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Qwen3 transformer in the Burn deep-learning framework, with a Rust-native GRPO reinforcement-learning trainer, bf16 mixed-precision training, and a batch-safe Linear for the CubeCL CUDA backend."
license = "MIT"
keywords = ["qwen", "llm", "grpo", "burn", "rl"]
categories = ["science", "text-processing"]
# Unmigrated CUDA probes in examples/ must not be auto-discovered by `cargo test`.
autoexamples = false

[dependencies]
# Burn 0.22 high-level API (Tensor/Module no longer generic over Backend; device selects compute).
# CPU uses the Flex backend (`ndarray` is deprecated in 0.22).
# default-features = false so pulling in `burn-wgpu` (via the `wgpu`/`metal`/`vulkan` features
# below) doesn't also drag in burn-wgpu's *default* feature set, which includes `fusion` --
# burn-fusion 0.22.0-pre.2's op-scheduling is buggy on the streamed-expert call pattern this
# crate uses (panics in burn-fusion's `stream::execution::ordering`), so it's kept off entirely.
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std", "store", "flex", "optim"] }
burn-store = { version = "0.22.0-pre.2", features = ["burnpack", "safetensors"] }
rootcause = "0.13.0"
thiserror = "2.0.20"
# Optional, cuda-only. Versions match Burn 0.22.0-pre.2 (cubecl 0.11 / cubek 0.3). Needed by custom
# CubeCL kernels and fusion-bridge examples. The previous git vendor patches (CUDA-graph capture
# FFI / device-seed RNG) are not ported to this cubecl/cubek pair yet.
cubecl = { version = "0.11.0-pre.2", default-features = false, optional = true }
cubek-random = { version = "0.3.0-pre.2", default-features = false, optional = true }
cubek-attention = { version = "0.3.0-pre.2", default-features = false, optional = true }
burn-cubecl = { version = "0.22.0-pre.2", optional = true }
burn-cubecl-fusion = { version = "0.22.0-pre.2", optional = true }
burn-fusion = { version = "0.22.0-pre.2", optional = true }
burn-ir = { version = "0.22.0-pre.2", optional = true }
tokenizers = "0.23"
rand = "0.10"
half = "2.7"
memmap2 = "0.9"
safetensors = "0.8"
# O(1) LRU for ExpertSlotPool (src/expert_stream.rs) -- the hand-rolled VecDeque-scan LRU it
# replaced was O(capacity) per touch, which made larger pool capacities *slower* overall despite
# fewer cache misses.
lru = "0.18.2"
# --- M-S serve-only deps (docs/SERVE_PLAN.md S3): optional, gated by the `serve` feature so the
# core library builds unchanged without them. ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"], optional = true }
axum = { version = "0.8", optional = true }
minijinja = { version = "2.24", features = ["json", "custom_syntax"], optional = true }
minijinja-contrib = { version = "2.24", features = ["pycompat"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# ReceiverStream + StreamExt so the SSE handler can feed axum's Sse from the engine's bounded
# return channel INCREMENTALLY (true streaming; the plan's "ReceiverStream feeds Sse").
tokio-stream = { version = "0.1", optional = true }

[dev-dependencies]
# The `generate` example runs on the Flex (CPU) backend out of the box. `autodiff` is enabled
# so the GRPO trainer integration test (tests/grpo_trainer.rs) can run a real backward pass on CPU.
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std", "store", "flex", "autodiff"] }
half = "2.7"
# GRPO math parity test: read the A0 Python reference tensors (tests/ref/grpo_expected.json).
serde_json = "1.0"

[features]
default = []
# CubeCL CUDA backend (NVIDIA GPU). On aarch64 (e.g. NVIDIA GB10 / Grace) build with
# RUSTFLAGS="-C target-feature=+fp16" to satisfy the half-precision intrinsics.
# CubeCL custom kernels (NVFP4 GEMV / fused MoE) on any CubeCL runtime.
# Enabled by `cuda` and by the portable GPU features (`wgpu`/`metal`/`vulkan`).
cubecl-gpu = ["dep:cubecl", "dep:burn-cubecl", "cubecl/stdlib"]
cuda = [
    "burn/cuda",
    "cubecl-gpu",
    "cubecl/cuda",
    "dep:cubek-random",
    "dep:cubek-attention",
    "dep:burn-cubecl-fusion",
    "dep:burn-fusion",
    "dep:burn-ir",
]
# Autodiff + dataset API, needed for the bf16 throughput benchmark.
train = ["burn/autodiff", "burn/dataset"]
# Portable GPU backend via wgpu (Vulkan/DX12/Metal, runtime-selected). No CUDA toolkit needed.
# NVFP4 CubeCL kernels launch on these runtimes; CUDA-graph capture and FP8 GEMMs stay CUDA-only.
wgpu = ["burn/wgpu", "cubecl-gpu", "cubecl/wgpu"]
# Same as `wgpu` but pins the wgpu shader compiler to MSL at compile time instead of runtime
# auto-dispatch. Useful on Apple Silicon.
metal = ["burn/metal", "cubecl-gpu", "cubecl/metal"]
# Pins the wgpu shader compiler to SPIR-V (Vulkan) at compile time. Useful on AMD/NVIDIA Linux/
# Windows hosts that have Vulkan but not the CUDA toolkit.
vulkan = ["burn/vulkan", "cubecl-gpu", "cubecl/vulkan"]
# M-S OpenAI-compat server (docs/SERVE_PLAN.md). Host-side parts (api/template/detok) build and
# test WITHOUT cuda; the engine + qwen-serve bin additionally need `cuda`.
serve = [
    "dep:tokio",
    "dep:axum",
    "dep:minijinja",
    "dep:minijinja-contrib",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio-stream",
]

[[bin]]
name = "qwen-serve"
path = "src/bin/qwen_serve.rs"
required-features = ["cuda", "serve"]

# Generic text generation on CPU (Flex). No GPU required.
[[example]]
name = "generate"
path = "examples/generate.rs"

# CPU-only cost breakdown of the streamed-expert NVFP4 repack (no GPU, no weights, no features).
[[example]]
name = "nvfp4_repack_bench"
path = "examples/nvfp4_repack_bench.rs"

# Minimal wgpu/vulkan/metal compute smoke test (no model weights needed).
[[example]]
name = "wgpu_smoke"
path = "examples/wgpu_smoke.rs"

[[example]]
name = "f16_matmul_probe"
path = "examples/f16_matmul_probe.rs"

[[example]]
name = "qwen35_generate_portable"
path = "examples/qwen35_generate_portable.rs"

[[example]]
name = "expert_slice_probe"
path = "examples/expert_slice_probe.rs"

[[example]]
name = "expert_stream_probe"
path = "examples/expert_stream_probe.rs"

[[example]]
name = "moe_block_stream_probe"
path = "examples/moe_block_stream_probe.rs"

